# Logging configuration for cluster debugging
loggers=org.apache.activemq.artemis.core.server.cluster,\
        org.apache.activemq.artemis.core.remoting.impl.invm,\
        org.apache.activemq.artemis.core.protocol.core,\
        org.apache.activemq.artemis.core.security,\
        org.apache.activemq.artemis.core.server

# Root logger
logger.level=WARN
logger.handlers=CONSOLE

# Cluster manager/controller/connection
logger.org.apache.activemq.artemis.core.server.cluster.level=TRACE

# InVM transport
logger.org.apache.activemq.artemis.core.remoting.impl.invm.level=TRACE

# Core protocol (ConnectMessage, SUBSCRIBE_TOPOLOGY, sendPostAuthTopology)
logger.org.apache.activemq.artemis.core.protocol.core.level=TRACE

# Security / authentication (handleClusterAuthentication, setAuthenticated)
logger.org.apache.activemq.artemis.core.security.level=TRACE

# General server (topology, lifecycle)
logger.org.apache.activemq.artemis.core.server.level=TRACE

# Console handler
handler.CONSOLE=org.jboss.logmanager.handlers.ConsoleHandler
handler.CONSOLE.level=TRACE
handler.CONSOLE.formatter=PATTERN
formatter.PATTERN=org.jboss.logmanager.formatters.PatternFormatter
formatter.PATTERN.properties=pattern
formatter.PATTERN.pattern=%d{HH:mm:ss,SSS} %-5p [%c] %m%n
